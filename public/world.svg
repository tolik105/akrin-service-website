<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#fafafa"/>
  
  <!-- Grid Lines -->
  <g stroke="#f0f0f0" stroke-width="1">
    <!-- Horizontal -->
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <!-- Vertical -->
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>
  
  <!-- World Map -->
  <g fill="#e8e8e8" stroke="#d1d1d1" stroke-width="0.5">
    <!-- North America -->
    <path d="M150,100 C170,85 200,80 220,90 C240,100 255,105 280,97 C305,89 320,80 345,85 C370,90 380,120 385,140 C390,160 385,180 375,200 C365,220 350,240 330,250 C310,260 290,265 270,260 C250,255 235,245 220,235 C205,225 190,210 180,190 C170,170 160,150 155,130 C150,110 140,105 150,100 Z"/>
    
    <!-- South America -->
    <path d="M270,260 C275,280 280,300 275,320 C270,340 260,360 245,380 C230,400 215,410 200,395 C185,380 180,360 195,345 C210,330 225,315 240,300 C255,285 265,270 270,260 Z"/>
    
    <!-- Europe -->
    <path d="M480,100 C495,90 510,85 525,90 C540,95 555,100 570,95 C585,90 595,85 610,90 C625,95 635,110 630,125 C625,140 610,150 595,155 C580,160 565,165 550,160 C535,155 520,150 505,145 C490,140 475,130 480,100 Z"/>
    
    <!-- Africa -->
    <path d="M505,165 C520,158 535,153 550,160 C565,167 580,180 587,195 C594,210 601,225 594,240 C587,255 573,270 559,277 C545,284 531,291 517,284 C503,277 489,263 482,249 C475,235 468,221 475,207 C482,193 496,180 505,165 Z"/>
    
    <!-- Asia -->
    <path d="M610,90 C630,83 650,76 670,90 C690,104 710,111 730,104 C750,97 764,90 778,104 C791,118 798,142 784,152 C771,166 757,180 744,194 C731,208 717,222 704,215 C691,208 677,194 664,180 C651,166 638,152 624,142 C611,128 597,118 610,90 Z"/>
    
    <!-- Japan (subtle highlight) -->
    <path d="M818,155 C821,152 827,148 830,152 C833,155 835,162 833,165 C830,168 826,170 824,169 C821,167 815,158 818,155 Z" fill="#f2f2f2" stroke="#adb2ff" stroke-width="0.7"/>
    <path d="M813,165 C816,162 819,161 821,164 C824,167 824,171 822,173 C819,176 816,175 813,173 C811,170 809,168 813,165 Z" fill="#f2f2f2" stroke="#adb2ff" stroke-width="0.7"/>
    <path d="M808,175 C811,172 815,170 817,173 C820,176 821,179 819,182 C816,185 813,184 810,182 C807,179 806,178 808,175 Z" fill="#f2f2f2" stroke="#adb2ff" stroke-width="0.7"/>
    
    <!-- Australia -->
    <path d="M800,330 C815,325 825,320 840,330 C855,340 860,355 855,370 C850,385 835,390 820,385 C805,380 790,375 785,360 C780,345 785,335 800,330 Z"/>
  </g>
  
  <!-- Japan Location Marker -->
  <g>
    <!-- Subtle Pulse Animation -->
    <circle cx="818" cy="155" r="15" fill="rgba(5,45,255,0.05)">
      <animate attributeName="r" values="15;25;15" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.05;0.1;0.05" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Marker -->
    <circle cx="818" cy="155" r="3" fill="rgba(5,45,255,0.5)" stroke="rgba(5,45,255,0.7)" stroke-width="1"/>
    
    <!-- Label -->
    <g transform="translate(818,155)">
      <line x1="0" y1="0" x2="30" y2="-15" stroke="#d1d1d1" stroke-width="0.75" />
      <rect x="30" y="-30" width="70" height="20" rx="10" fill="rgba(5,45,255,0.07)" stroke="rgba(5,45,255,0.2)" stroke-width="0.5"/>
      <text x="65" y="-17" font-family="Inter, sans-serif" font-size="9" fill="#555" text-anchor="middle">Tokyo, Japan</text>
    </g>
  </g>
</svg>
